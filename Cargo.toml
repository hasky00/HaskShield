[package]
name = "haskshield"
version = "0.1.0"
edition = "2024"
description = "A Nostr-native shield that sits in front of a relay and keeps spam and floods out"
license = "MIT"
repository = "https://github.com/hasky00/HaskShield"

[dependencies]
futures-util = "0.3.34"
nostr = "0.45.7"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros", "time", "io-util"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
nostr = { version = "0.45.7", features = ["os-rng"] }
